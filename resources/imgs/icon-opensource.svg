<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EADDFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8DEF8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#grad1)"/>
  
  <!-- Code brackets and heart symbol -->
  <g transform="translate(100, 100)">
    <!-- Left bracket -->
    <path d="M -50 -40 L -65 -40 L -75 0 L -65 40 L -50 40" 
          stroke="#6750A4" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right bracket -->
    <path d="M 50 -40 L 65 -40 L 75 0 L 65 40 L 50 40" 
          stroke="#6750A4" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Heart in the middle -->
    <path d="M 0 -10 
             C -10 -20, -20 -20, -20 -10
             C -20 0, -10 10, 0 20
             C 10 10, 20 0, 20 -10
             C 20 -20, 10 -20, 0 -10 Z" 
          fill="#7D5260"/>
  </g>
</svg>