<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EADDFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8DEF8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#grad2)"/>
  
  <!-- Server/Database icon -->
  <g transform="translate(100, 100)">
    <!-- Top server -->
    <rect x="-50" y="-50" width="100" height="30" rx="5" fill="#6750A4"/>
    <circle cx="-30" cy="-35" r="4" fill="#FFFFFF"/>
    <circle cx="-15" cy="-35" r="4" fill="#FFFFFF"/>
    <rect x="10" y="-40" width="30" height="10" rx="2" fill="#FFFFFF"/>
    
    <!-- Middle server -->
    <rect x="-50" y="-15" width="100" height="30" rx="5" fill="#625B71"/>
    <circle cx="-30" cy="0" r="4" fill="#FFFFFF"/>
    <circle cx="-15" cy="0" r="4" fill="#FFFFFF"/>
    <rect x="10" y="-5" width="30" height="10" rx="2" fill="#FFFFFF"/>
    
    <!-- Bottom server -->
    <rect x="-50" y="20" width="100" height="30" rx="5" fill="#7D5260"/>
    <circle cx="-30" cy="35" r="4" fill="#FFFFFF"/>
    <circle cx="-15" cy="35" r="4" fill="#FFFFFF"/>
    <rect x="10" y="30" width="30" height="10" rx="2" fill="#FFFFFF"/>
  </g>
</svg>