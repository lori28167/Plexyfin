<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EADDFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8DEF8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#grad3)"/>
  
  <!-- Puzzle pieces -->
  <g transform="translate(100, 100)">
    <!-- Top-left piece -->
    <path d="M -60 -60 L -10 -60 L -10 -50 L 0 -50 L 0 -40 L -10 -40 L -10 -10 L -20 -10 L -20 0 L -30 0 L -30 -10 L -60 -10 Z" 
          fill="#6750A4" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Top-right piece -->
    <path d="M 10 -60 L 60 -60 L 60 -10 L 50 -10 L 50 0 L 40 0 L 40 -10 L 10 -10 L 10 -40 L 0 -40 L 0 -50 L 10 -50 Z" 
          fill="#625B71" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Bottom-left piece -->
    <path d="M -60 10 L -30 10 L -30 0 L -20 0 L -20 10 L -10 10 L -10 40 L 0 40 L 0 50 L -10 50 L -10 60 L -60 60 Z" 
          fill="#7D5260" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Bottom-right piece -->
    <path d="M 10 10 L 40 10 L 40 0 L 50 0 L 50 10 L 60 10 L 60 60 L 10 60 L 10 50 L 0 50 L 0 40 L 10 40 Z" 
          fill="#6750A4" stroke="#FFFFFF" stroke-width="2"/>
